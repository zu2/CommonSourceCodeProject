name: Build eBASICMasterJr

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: |
          msbuild 'vc++2026\bmjr.vcxproj' /p:Configuration=Release /p:Platform=x64 /m

      - name: Collect the binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Get-ChildItem -Recurse -Include *.exe |
            Where-Object { $_.FullName -notmatch '\\obj\\' } |
            Copy-Item -Destination out
          Get-ChildItem out | ForEach-Object { $_.Name }

      - uses: actions/upload-artifact@v4
        with:
          name: eBASICMasterJr
          path: out

      - name: Look for a tag named after today
        id: tag
        shell: pwsh
        run: |
          $d = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'Tokyo Standard Time').ToString('yyyyMMdd')
          $found = (git ls-remote --tags origin "refs/tags/$d") -ne $null
          "name=$d" >> $env:GITHUB_OUTPUT
          "found=$($found.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "tag $d found=$found"

      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.found == 'true'
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: out/*.exe
